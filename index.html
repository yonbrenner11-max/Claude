<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AniStream — discover, explore, and track anime. Browse top and seasonal titles, watch trailers, and build your watchlist." />
  <title>AniStream — Discover & Track Anime</title>
  <link rel="preconnect" href="https://api.jikan.moe" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="AniStream home">
        <span class="brand-mark">🌸</span>
        <span class="brand-name">Ani<span>Stream</span></span>
      </a>

      <form class="search" role="search" id="search-form">
        <input
          type="search"
          id="search-input"
          name="q"
          placeholder="Search anime…"
          autocomplete="off"
          aria-label="Search anime"
        />
        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        </button>
      </form>

      <nav class="main-nav" aria-label="Primary">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/top" data-nav="top">Top</a>
        <a href="#/season" data-nav="season">This Season</a>
        <a href="#/watchlist" data-nav="watchlist">My List <span class="badge" id="watchlist-count">0</span></a>
      </nav>

      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="app" class="app">
    <!-- Views render here -->
  </main>

  <footer class="site-footer">
    <p>
      AniStream is a demo discovery app. Data &amp; trailers courtesy of the
      <a href="https://jikan.moe" target="_blank" rel="noopener">Jikan API</a>
      (MyAnimeList). No copyrighted video is hosted here.
    </p>
  </footer>

  <!-- Detail modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" data-close aria-label="Close">&times;</button>
      <div class="modal-body" id="modal-body"><!-- detail --></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js" defer></script>
</body>
</html>
